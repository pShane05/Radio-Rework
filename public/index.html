<!DOCTYPE html>
<html>
<head>
    <title>Spotify API Client</title>
    <script src="spotify-auth.js"></script>
    <script src="spotify-api.js"></script>
    <script src="lastfm_api.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href=styles.css>
</head>
<body>
    <div class="headerBar">

        <div class="account">
            <div id="profile-pic">
              <img src=""/>
            </div>
            <button class="button" id="logout-button">Logout</button>
        </div>

        <div class="titlePair">
            <h1 class="title">Radio Rework </h1>
            <img src="logo.png" alt="" style="width: 5%;">
        </div><h1 class="title">

        <div id="search-container">
          <input type="text" id="search-bar" placeholder="Search..." data-search>
        </div>
    </div>

    <div id="main-display">

        <div class="recents">
            <h2 class="heading">Recent Listening</h2>
            <div class="row" id="recents"> </div>

        </div>

        <div class="Artists">
            <h2 class="heading">Followed Artists</h2>
            <div class="row" id="following"> </div>

        </div>

    </div>

    <div id="search-display">
        <h2>Search Results</h2>
        <div class="searchTracks" data-track-container></div>

    </div>

    <!-- Templates -->

    <template data-artist-cover-template>
        <div class="artistCover">
            <div class="coverImageContainerArtist">
                <img src="" data-artist-image/>
            </div>
            <h4 class="name" data-artist-name>Artist name</h2>
        </div>
    </template>

    <template data-track-card-template>
        <div class="trackCard">
            <img class="trackImage" data-cover/>
            <div class="songDesc">
                <h4 class="title" data-title></h4>
                <h5 class="artist" data-artist></h5>
            </div>
            <p class="trackObject" style="display: none" data-track-id></p>
        </div>
    </template>

    <template data-recent-card>
        <div class="recent">
            <div class="coverImageContainerRecent">
                <img class="coverImage"src="" data-cover/>
            </div>
            <h4 class="title" data-title></h2>
        </div>
    </template>

</body>
</html>
